name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Validate structure data
        run: |
          python3 scripts/gen_structures.py --check
          python3 scripts/validate_structures.py
      - name: Build mod
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: underground-villages
          path: build/libs/*.jar
